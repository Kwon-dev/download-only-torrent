name: Windows EXE

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    # Match libtorrent's own Windows Python-binding CI toolchain rather than
    # floating windows-latest to a newer Visual Studio image unexpectedly.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller pillow pefile

      - name: Build patched libtorrent
        shell: pwsh
        run: .\tools\build_patched_libtorrent.ps1 -Python python

      - name: Generate app icon
        run: python tools/generate_icon.py

      - name: Syntax check
        run: python -m compileall -q app.py download_only_torrent tools

      - name: Verify patched libtorrent before packaging
        run: python tools/verify_patched_libtorrent.py

      - name: Build Windows app folder
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed
          --name DownloadOnlyTorrent
          --icon assets/app.ico
          --collect-all libtorrent
          app.py

      - name: Verify embedded Windows icon
        shell: pwsh
        run: |
          @'
          import pefile
          pe = pefile.PE(r"dist\DownloadOnlyTorrent\DownloadOnlyTorrent.exe")
          resource_ids = {
              entry.id for entry in pe.DIRECTORY_ENTRY_RESOURCE.entries
              if entry.name is None
          }
          assert 3 in resource_ids, "RT_ICON resource missing"
          assert 14 in resource_ids, "RT_GROUP_ICON resource missing"
          print("Embedded icon resources verified.")
          '@ | python -

      - name: Verify packaged libtorrent is hard-disabled build
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          marker = b"DOWNLOAD_ONLY_TORRENT_PIECE_UPLOAD_DISABLED"
          modules = list(Path(r"dist\DownloadOnlyTorrent").rglob("libtorrent*.pyd"))
          assert modules, "packaged libtorrent .pyd not found"
          assert any(marker in p.read_bytes() for p in modules), (
              "packaged libtorrent does not contain the compile-time hard-disable marker"
          )
          print("Packaged patched libtorrent verified:", modules)
          '@ | python -

      - name: Add licenses and build provenance
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "download-only-torrent-deps"
          $vcpkgRoot = $env:VCPKG_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) { $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT }
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) { $vcpkgRoot = "C:\vcpkg" }
          python tools/package_release_metadata.py `
            --app-dir .\dist\DownloadOnlyTorrent `
            --boost-root (Join-Path $work "boost") `
            --openssl-root (Join-Path $vcpkgRoot "installed\x64-windows-static-md") `
            --libtorrent-source (Join-Path $work "libtorrent")

      - name: Smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\DownloadOnlyTorrent\DownloadOnlyTorrent.exe -ArgumentList '--version' -PassThru -Wait
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      # upload-artifact already produces a ZIP when users download the artifact.
      # Upload the folder contents directly so there is no ZIP inside ZIP.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DownloadOnlyTorrent-windows-x64-r${{ github.run_number }}
          path: dist/DownloadOnlyTorrent/**
          if-no-files-found: error
          retention-days: 14

      # GitHub Releases do not automatically wrap folders, so create exactly one
      # archive only for tagged releases.
      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $zip = ".\dist\DownloadOnlyTorrent-windows-x64-r${{ github.run_number }}.zip"
          Compress-Archive -Path .\dist\DownloadOnlyTorrent\* -DestinationPath $zip -Force
          Write-Host "Built: $zip"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DownloadOnlyTorrent-windows-x64-r${{ github.run_number }}.zip
