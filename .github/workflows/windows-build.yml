name: Windows EXE

# Branches and pull requests run the fast Linux tests (tests.yml). The full
# Windows build runs on main, on release tags, on its schedule, or by hand
# (Actions > Windows EXE > Run workflow) when a branch needs it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  # GitHub evicts caches that go unused for 7 days, which turns the next build
  # into a ~25 minute libtorrent compile. A periodic run on main restores the
  # wheel cache (refreshing it) or, if it was already evicted, rebuilds and
  # saves it so PR and tag builds that follow stay fast.
  schedule:
    - cron: '23 3 */4 * *'

# Build and PR jobs only need repository read access. The tagged-release job
# below is the only job allowed to write release assets back to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # Cache only the reusable build outputs. The key intentionally excludes
      # CI/build orchestration scripts: only the declared binary inputs and the
      # actual libtorrent source transformation invalidate this wheel cache.
      - name: Restore patched libtorrent wheel cache
        id: libtorrent-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\patched-libtorrent-cache
          key: patched-libtorrent-${{ runner.os }}-py311-${{ hashFiles('tools/libtorrent_build_manifest.json', 'tools/patch_libtorrent_no_piece_upload.py') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller pillow pefile

      - name: Build or restore patched libtorrent
        shell: pwsh
        env:
          PATCHED_LIBTORRENT_CACHE: ${{ runner.temp }}\patched-libtorrent-cache
        run: .\tools\build_patched_libtorrent.ps1 -Python python

      # Save immediately after a successful cold build so later packaging
      # failures never waste the expensive libtorrent compilation.
      - name: Save patched libtorrent wheel cache
        if: steps.libtorrent-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\patched-libtorrent-cache
          key: ${{ steps.libtorrent-cache.outputs.cache-primary-key }}

      - name: Generate app icon
        run: python tools/generate_icon.py

      - name: Syntax check
        run: python -m compileall -q app.py download_only_torrent tools

      - name: Verify patched libtorrent before packaging
        run: python tools/verify_patched_libtorrent.py

      # Preserve the exact verified extension module outside PyInstaller's work
      # tree. PyInstaller is allowed to process extension binaries while
      # collecting them; the final release is explicitly restored from this
      # verified staging copy afterwards.
      - name: Stage exact patched libtorrent binary
        run: python tools/finalize_patched_libtorrent.py stage --stage-dir "${{ runner.temp }}\patched-libtorrent-stage"

      - name: Build Windows app folder
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed --noupx
          --name DownloadOnlyTorrent
          --icon assets/app.ico
          --collect-all libtorrent
          app.py

      - name: Verify embedded Windows icon
        shell: pwsh
        run: |
          @'
          import pefile
          pe = pefile.PE(r"dist\DownloadOnlyTorrent\DownloadOnlyTorrent.exe")
          resource_ids = {
              entry.id for entry in pe.DIRECTORY_ENTRY_RESOURCE.entries
              if entry.name is None
          }
          assert 3 in resource_ids, "RT_ICON resource missing"
          assert 14 in resource_ids, "RT_GROUP_ICON resource missing"
          print("Embedded icon resources verified.")
          '@ | python -

      - name: Restore and verify exact patched libtorrent in package
        run: >-
          python tools/finalize_patched_libtorrent.py finalize
          --stage-dir "${{ runner.temp }}\patched-libtorrent-stage"
          --dist-dir .\dist\DownloadOnlyTorrent

      - name: Add licenses and build provenance
        run: >-
          python tools/package_release_metadata.py
          --app-dir .\dist\DownloadOnlyTorrent
          --cache-dir "${{ runner.temp }}\patched-libtorrent-cache"

      - name: Smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\DownloadOnlyTorrent\DownloadOnlyTorrent.exe -ArgumentList '--version' -PassThru -Wait
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      # upload-artifact already produces a ZIP when users download the artifact.
      # Upload the folder contents directly so there is no ZIP inside ZIP.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DownloadOnlyTorrent-windows-x64-r${{ github.run_number }}
          path: dist/DownloadOnlyTorrent/**
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: DownloadOnlyTorrent-windows-x64-r${{ github.run_number }}
          path: dist/DownloadOnlyTorrent

      - name: Create release archive
        shell: pwsh
        run: |
          $zip = ".\dist\DownloadOnlyTorrent-windows-x64-r${{ github.run_number }}.zip"
          Compress-Archive -Path .\dist\DownloadOnlyTorrent\* -DestinationPath $zip -Force
          Write-Host "Built: $zip"

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DownloadOnlyTorrent-windows-x64-r${{ github.run_number }}.zip
