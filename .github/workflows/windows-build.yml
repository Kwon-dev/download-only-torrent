name: Windows EXE

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    # Match libtorrent's own Windows Python-binding CI toolchain rather than
    # floating windows-latest to a newer Visual Studio image unexpectedly.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # Restore the expensive source/build workspace before building. Split
      # restore/save instead of using actions/cache as one step so a later
      # packaging failure cannot prevent a freshly built wheel from being
      # cached for the next retry.
      - name: Restore patched libtorrent toolchain cache
        id: libtorrent-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}\download-only-torrent-deps
            C:\vcpkg\installed\x64-windows-static-md
          key: patched-libtorrent-${{ runner.os }}-py311-v2.1.1-boost1.91.0-${{ hashFiles('tools/build_patched_libtorrent.ps1', 'tools/patch_libtorrent_no_piece_upload.py') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller pillow pefile

      - name: Build patched libtorrent
        shell: pwsh
        run: .\tools\build_patched_libtorrent.ps1 -Python python

      # Save immediately after a successful build. This is intentionally before
      # PyInstaller and the release checks: if those fail, the ~30 minute
      # libtorrent build is still reusable on the next CI run.
      - name: Save patched libtorrent toolchain cache
        if: steps.libtorrent-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}\download-only-torrent-deps
            C:\vcpkg\installed\x64-windows-static-md
          key: ${{ steps.libtorrent-cache.outputs.cache-primary-key }}

      - name: Generate app icon
        run: python tools/generate_icon.py

      - name: Syntax check
        run: python -m compileall -q app.py download_only_torrent tools

      - name: Verify patched libtorrent before packaging
        run: python tools/verify_patched_libtorrent.py

      - name: Build Windows app folder
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed --noupx
          --name DownloadOnlyTorrent
          --icon assets/app.ico
          --collect-all libtorrent
          app.py

      - name: Verify embedded Windows icon
        shell: pwsh
        run: |
          @'
          import pefile
          pe = pefile.PE(r"dist\DownloadOnlyTorrent\DownloadOnlyTorrent.exe")
          resource_ids = {
              entry.id for entry in pe.DIRECTORY_ENTRY_RESOURCE.entries
              if entry.name is None
          }
          assert 3 in resource_ids, "RT_ICON resource missing"
          assert 14 in resource_ids, "RT_GROUP_ICON resource missing"
          print("Embedded icon resources verified.")
          '@ | python -

      - name: Verify packaged libtorrent is hard-disabled build
        shell: pwsh
        run: |
          @'
          import hashlib
          import importlib.util
          from pathlib import Path

          marker = b"DOWNLOAD_ONLY_TORRENT_PIECE_UPLOAD_DISABLED"

          # Verify the source module used by PyInstaller first. Its SHA is only
          # diagnostic: PyInstaller may legitimately rewrite PE metadata while
          # collecting an extension module, so byte-for-byte equality is not a
          # valid packaging invariant.
          spec = importlib.util.find_spec("libtorrent")
          assert spec is not None and spec.origin, "installed libtorrent not found"
          installed = Path(spec.origin).resolve()
          installed_data = installed.read_bytes()
          assert marker in installed_data, "installed libtorrent is not the patched build"
          installed_sha256 = hashlib.sha256(installed_data).hexdigest()
          print(f"Installed patched module: {installed} SHA-256={installed_sha256}")

          modules = list(Path(r"dist\DownloadOnlyTorrent").rglob("libtorrent*.pyd"))
          assert modules, "packaged libtorrent .pyd not found"

          marker_matches = []
          for module in modules:
              data = module.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              has_marker = marker in data
              print(f"Packaged candidate: {module} SHA-256={digest} marker={has_marker}")
              if has_marker:
                  marker_matches.append(module)

          assert marker_matches, (
              "no packaged libtorrent module contains the compile-time hard-disable marker"
          )
          print("Packaged patched libtorrent verified:", marker_matches)
          '@ | python -

      - name: Add licenses and build provenance
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "download-only-torrent-deps"
          $vcpkgRoot = $env:VCPKG_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) { $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT }
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) { $vcpkgRoot = "C:\vcpkg" }
          python tools/package_release_metadata.py `
            --app-dir .\dist\DownloadOnlyTorrent `
            --boost-root (Join-Path $work "boost") `
            --openssl-root (Join-Path $vcpkgRoot "installed\x64-windows-static-md") `
            --libtorrent-source (Join-Path $work "libtorrent")

      - name: Smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\DownloadOnlyTorrent\DownloadOnlyTorrent.exe -ArgumentList '--version' -PassThru -Wait
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      # upload-artifact already produces a ZIP when users download the artifact.
      # Upload the folder contents directly so there is no ZIP inside ZIP.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DownloadOnlyTorrent-windows-x64-r${{ github.run_number }}
          path: dist/DownloadOnlyTorrent/**
          if-no-files-found: error
          retention-days: 14

      # GitHub Releases do not automatically wrap folders, so create exactly one
      # archive only for tagged releases.
      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $zip = ".\dist\DownloadOnlyTorrent-windows-x64-r${{ github.run_number }}.zip"
          Compress-Archive -Path .\dist\DownloadOnlyTorrent\* -DestinationPath $zip -Force
          Write-Host "Built: $zip"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DownloadOnlyTorrent-windows-x64-r${{ github.run_number }}.zip
