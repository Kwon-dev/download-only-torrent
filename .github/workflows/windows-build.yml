name: Windows EXE

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow pefile

      - name: Generate app icon
        run: python tools/generate_icon.py

      - name: Syntax check
        run: python -m compileall -q app.py download_only_torrent tools

      - name: Build Windows app folder
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed
          --name DownloadOnlyTorrent
          --icon assets/app.ico
          --collect-all libtorrent
          app.py

      - name: Verify embedded Windows icon
        shell: pwsh
        run: |
          @'
          import pefile
          pe = pefile.PE(r"dist\DownloadOnlyTorrent\DownloadOnlyTorrent.exe")
          resource_ids = {
              entry.id for entry in pe.DIRECTORY_ENTRY_RESOURCE.entries
              if entry.name is None
          }
          assert 3 in resource_ids, "RT_ICON resource missing"
          assert 14 in resource_ids, "RT_GROUP_ICON resource missing"
          print("Embedded icon resources verified.")
          '@ | python -

      - name: Add license and source-offer files
        shell: pwsh
        run: |
          $app = ".\dist\DownloadOnlyTorrent"
          $licenses = Join-Path $app "LICENSES"
          New-Item -ItemType Directory -Force -Path $licenses | Out-Null
          Copy-Item .\LICENSE (Join-Path $app "LICENSE")
          Copy-Item .\THIRD_PARTY_NOTICES.md (Join-Path $app "THIRD_PARTY_NOTICES.md")
          Copy-Item .\QT_LGPL_SOURCE_OFFER.md (Join-Path $app "QT_LGPL_SOURCE_OFFER.md")
          Copy-Item .\LICENSES\libtorrent.txt (Join-Path $licenses "libtorrent.txt")
          Invoke-WebRequest https://www.gnu.org/licenses/lgpl-3.0.txt -OutFile (Join-Path $licenses "LGPL-3.0.txt")
          Invoke-WebRequest https://www.gnu.org/licenses/gpl-3.0.txt -OutFile (Join-Path $licenses "GPL-3.0.txt")
          @'
          from pathlib import Path
          import shutil
          import sys

          out = Path(r"dist\DownloadOnlyTorrent\LICENSES\Python-3.11.txt")
          candidates = [
              Path(sys.base_prefix) / "LICENSE.txt",
              Path(sys.base_prefix) / "LICENSE",
              Path(sys.prefix) / "LICENSE.txt",
              Path(sys.prefix) / "LICENSE",
          ]
          for candidate in candidates:
              if candidate.is_file():
                  shutil.copy2(candidate, out)
                  print(f"Copied Python license from {candidate}")
                  break
          else:
              raise SystemExit("Python runtime license file not found")
          '@ | python -

      - name: Smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\DownloadOnlyTorrent\DownloadOnlyTorrent.exe -ArgumentList '--version' -PassThru -Wait
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      # upload-artifact already produces a ZIP when users download the artifact.
      # Upload the folder contents directly so there is no ZIP inside ZIP.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DownloadOnlyTorrent-windows-x64-r${{ github.run_number }}
          path: dist/DownloadOnlyTorrent/**
          if-no-files-found: error
          retention-days: 14

      # GitHub Releases do not automatically wrap folders, so create exactly one
      # archive only for tagged releases.
      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $zip = ".\dist\DownloadOnlyTorrent-windows-x64-r${{ github.run_number }}.zip"
          Compress-Archive -Path .\dist\DownloadOnlyTorrent\* -DestinationPath $zip -Force
          Write-Host "Built: $zip"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DownloadOnlyTorrent-windows-x64-r${{ github.run_number }}.zip
