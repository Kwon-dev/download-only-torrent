name: Windows EXE

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow pefile

      - name: Generate app icon
        run: python tools/generate_icon.py

      - name: Syntax check
        run: python -m compileall -q app.py download_only_torrent tools

      - name: Build EXE
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name DownloadOnlyTorrent
          --icon assets/app.ico
          --collect-all libtorrent
          app.py

      - name: Verify embedded Windows icon
        shell: pwsh
        run: |
          @'
          import pefile
          pe = pefile.PE(r"dist\DownloadOnlyTorrent.exe")
          resource_ids = {
              entry.id for entry in pe.DIRECTORY_ENTRY_RESOURCE.entries
              if entry.name is None
          }
          assert 3 in resource_ids, "RT_ICON resource missing"
          assert 14 in resource_ids, "RT_GROUP_ICON resource missing"
          print("Embedded icon resources verified.")
          '@ | python -

      - name: Smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\DownloadOnlyTorrent.exe -ArgumentList '--version' -PassThru -Wait
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Create cache-safe artifact filename
        shell: pwsh
        run: Copy-Item .\dist\DownloadOnlyTorrent.exe ".\dist\DownloadOnlyTorrent-r${{ github.run_number }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DownloadOnlyTorrent-windows-x64-r${{ github.run_number }}
          path: dist/DownloadOnlyTorrent-r${{ github.run_number }}.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DownloadOnlyTorrent.exe
